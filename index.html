<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TandaManager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-6">
        <header class="border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold text-indigo-400">TandaManager Pro</h1>
            <p class="text-[10px] text-slate-500 italic">Rock & Metal Control</p>
        </header>

        <!-- Pestañas -->
        <div class="flex gap-2">
            <button onclick="tab('tandas')" class="flex-1 bg-indigo-600 p-2 rounded-lg text-xs font-bold">Tandas</button>
            <button onclick="tab('productos')" class="flex-1 bg-slate-800 p-2 rounded-lg text-xs font-bold">Catálogo</button>
        </div>

        <div id="vista" class="space-y-4"></div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('db')) || { tandas: [], productos: [] };

        function save() { localStorage.setItem('db', JSON.stringify(db)); render(); }

        function tab(view) {
            const v = document.getElementById('vista');
            if (view === 'tandas') {
                v.innerHTML = `<h2 class="font-bold">Tandas</h2>
                    ${db.tandas.map((t, i) => `
                        <div class="bg-slate-900 p-3 rounded-lg border border-slate-800 flex justify-between">
                            <div><p class="font-bold">${t.nombre}</p><p class="text-xs text-slate-400">$${t.monto}</p></div>
                            <button onclick="db.tandas.splice(${i},1); save();" class="text-red-500">✕</button>
                        </div>`).join('')}
                    <button onclick="let n = prompt('Nombre:'); if(n) {db.tandas.push({nombre:n, monto:0}); save();}" class="w-full bg-indigo-600 p-2 rounded-lg text-xs font-bold">+ Nueva</button>`;
            } else {
                v.innerHTML = `<h2 class="font-bold">Catálogo</h2>
                    ${db.productos.map((p, i) => `
                        <div class="bg-slate-900 p-3 rounded-lg border border-slate-800 flex justify-between">
                            <p>${p.nombre}</p>
                            <button onclick="db.productos.splice(${i},1); save();" class="text-red-500">✕</button>
                        </div>`).join('')}
                    <button onclick="let n = prompt('Producto:'); if(n) {db.productos.push({nombre:n}); save();}" class="w-full bg-slate-800 p-2 rounded-lg text-xs font-bold">+ Producto</button>`;
            }
        }
        function render() { tab(document.querySelector('.bg-indigo-600').innerText.toLowerCase()); }
        tab('tandas');
    </script>
</body>
</html>
