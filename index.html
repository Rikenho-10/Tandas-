<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TandaManager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white font-sans p-4">
    <div id="root" class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold text-yellow-500 mb-6">TandaManager - Rock Edition</h1>
        <div id="app-content" class="space-y-4">
            <p>Iniciando sistema...</p>
        </div>
    </div>

    <script>
        // Borramos todo rastro de versiones anteriores para forzar un inicio limpio
        localStorage.clear();

        const data = {
            titulo: "Bienvenido Ricardo",
            mensaje: "El sistema se ha reiniciado correctamente.",
            opciones: ["Cargar Inventario", "Ver Tandas"]
        };

        function render() {
            document.getElementById('app-content').innerHTML = `
                <div class="bg-gray-900 p-6 rounded-xl border border-gray-700">
                    <h2 class="text-xl font-bold mb-2">${data.titulo}</h2>
                    <p class="text-gray-400 mb-4">${data.mensaje}</p>
                    <div class="space-y-2">
                        ${data.opciones.map(o => `<button class="w-full bg-indigo-700 hover:bg-indigo-600 p-3 rounded-lg font-bold">${o}</button>`).join('')}
                    </div>
                </div>
            `;
        }
        render();
    </script>
</body>
</html>
