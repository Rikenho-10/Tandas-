<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TandaManager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = JSON.parse('__firebase_config');
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tanda-pro-cloud';

        let state = { tandas: [], productos: [] };

        async function updateCloud() {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'db'), state);
        }

        signInAnonymously(auth).then(() => {
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'db'), (snap) => {
                if (snap.exists()) {
                    state = snap.data();
                    render();
                } else {
                    render();
                }
            });
        });

        window.render = () => {
            document.getElementById('app').innerHTML = `
                <div class="space-y-6">
                    <h2 class="text-indigo-400 font-bold border-b border-slate-800 pb-2">Tandas Activas</h2>
                    ${state.tandas.map((t, i) => `
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                            <div class="flex justify-between mb-2">
                                <p class="font-bold text-sm">${t.cliente}</p>
                                <p class="text-xs text-emerald-400">$${t.pagos.filter(p=>p).length * (t.monto/t.semanas)} / $${t.monto}</p>
                            </div>
                            <div class="flex flex-wrap gap-1">
                                ${t.pagos.map((p, pi) => `<button onclick="marcar(${i}, ${pi})" class="w-7 h-7 rounded ${p?'bg-emerald-600':'bg-slate-700'} text-[10px]">${pi+1}</button>`).join('')}
                            </div>
                        </div>
                    `).join('')}
                    <button onclick="nuevaTanda()" class="w-full bg-indigo-600 py-3 rounded-lg font-bold text-xs">+ Nueva Tanda</button>
                </div>
            `;
        };

        window.marcar = (tIdx, pIdx) => {
            state.tandas[tIdx].pagos[pIdx] = !state.tandas[tIdx].pagos[pIdx];
            updateCloud();
        };

        window.nuevaTanda = () => {
            let cliente = prompt("Nombre del cliente:");
            let monto = parseFloat(prompt("Monto total:"));
            let semanas = parseInt(prompt("Número de semanas:"));
            if(cliente && monto && semanas) {
                state.tandas.push({cliente, monto, semanas, pagos: Array(semanas).fill(false)});
                updateCloud();
            }
        };
    </script>
</head>
<body class="bg-slate-950 text-white p-4">
    <div id="app" class="max-w-md mx-auto">
        <p class="text-slate-500">Conectando a la base de datos...</p>
    </div>
</body>
</html>
